<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Discount Curve Lab</title>
  <desc id="desc">A synthetic, local-only, dry-run-first Python demo validates fictional observations, fits Nelson-Siegel-Svensson zero rates, generates explicit continuous discount factors, reports evidence, and writes local files only after opt-in.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="0.55" stop-color="#111b28"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#f8fafc" stroke-opacity="0.035"/></pattern>
    <style>.eyebrow{font:760 18px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.7px}.headline{font:800 58px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-1.4px}.body{font:560 25px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.small{font:650 18px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font:650 16px ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><rect width="1280" height="720" rx="32" fill="url(#grid)"/><circle cx="1220" cy="-30" r="310" fill="#f59e0b" opacity=".08"/><circle cx="20" cy="720" r="300" fill="#14b8a6" opacity=".07"/>

  <g transform="translate(70 78)">
    <text class="eyebrow" fill="#fcd34d">FREE · SYNTHETIC · PYTHON</text>
    <text y="70" class="headline" fill="#f8fafc">Synthetic Discount</text><text y="138" class="headline" fill="#f8fafc">Curve Lab</text>
    <text y="190" class="body" fill="#cbd5e1">Fit zero rates. Generate discount factors.</text><text y="226" class="body" fill="#cbd5e1">Cross the write boundary only on opt-in.</text>
    <g transform="translate(0 272)">
      <rect width="155" height="48" rx="24" fill="#1f2937" stroke="#fbbf24" stroke-opacity=".38"/><text x="77" y="31" text-anchor="middle" class="small" fill="#fde68a">Local only</text>
      <rect x="170" width="176" height="48" rx="24" fill="#1f2937" stroke="#2dd4bf" stroke-opacity=".38"/><text x="258" y="31" text-anchor="middle" class="small" fill="#99f6e4">Dry-run first</text>
      <rect x="361" width="190" height="48" rx="24" fill="#1f2937" stroke="#94a3b8" stroke-opacity=".35"/><text x="456" y="31" text-anchor="middle" class="small" fill="#e2e8f0">Continuous DF</text>
    </g>
  </g>

  <g transform="translate(680 68)" filter="url(#shadow)">
    <rect width="530" height="386" rx="28" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".24"/>
    <text x="30" y="48" class="eyebrow" fill="#cbd5e1">ILLUSTRATIVE SYNTHETIC ZERO RATES</text>
    <g transform="translate(48 84)">
      <path d="M0 0V236H430" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <path d="M0 48H430M0 96H430M0 144H430M0 192H430" stroke="#64748b" stroke-opacity=".28"/>
      <path d="M0 183 C55 146,88 138,138 126 S245 113,430 100" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 202 C62 177,105 158,170 150 S286 136,430 132" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 138 C50 104,105 78,168 66 S298 61,430 72" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 92 C54 68,105 47,164 38 S292 35,430 44" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="270" class="mono" fill="#94a3b8">1D</text><text x="190" y="270" class="mono" fill="#94a3b8">10Y</text><text x="405" y="270" class="mono" fill="#94a3b8">30Y</text>
    </g>
  </g>

  <g transform="translate(70 520)">
    <rect width="1140" height="124" rx="26" fill="#0f172a" stroke="url(#accent)" stroke-opacity=".42"/>
    <g transform="translate(28 25)"><rect width="240" height="74" rx="18" fill="#172033"/><text x="120" y="31" text-anchor="middle" class="small" fill="#f8fafc">01 · Validate</text><text x="120" y="56" text-anchor="middle" class="mono" fill="#94a3b8">synthetic CSV + TOML</text></g>
    <path d="M282 62h40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><path d="M328 62l-11-8v16z" fill="#fbbf24"/>
    <g transform="translate(336 25)"><rect width="240" height="74" rx="18" fill="#172033"/><text x="120" y="31" text-anchor="middle" class="small" fill="#f8fafc">02 · Fit NSS</text><text x="120" y="56" text-anchor="middle" class="mono" fill="#94a3b8">deterministic multi-start</text></g>
    <path d="M590 62h40" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/><path d="M636 62l-11-8v16z" fill="#5eead4"/>
    <g transform="translate(644 25)"><rect width="240" height="74" rx="18" fill="#172033"/><text x="120" y="31" text-anchor="middle" class="small" fill="#f8fafc">03 · Convert</text><text x="120" y="56" text-anchor="middle" class="mono" fill="#94a3b8">DF(t) = exp(-z(t)t)</text></g>
    <path d="M898 62h40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><path d="M944 62l-11-8v16z" fill="#94a3b8"/>
    <g transform="translate(952 25)"><rect width="160" height="74" rx="18" fill="#172033"/><text x="80" y="31" text-anchor="middle" class="small" fill="#f8fafc">04 · Opt in</text><text x="80" y="56" text-anchor="middle" class="mono" fill="#94a3b8">local CSV</text></g>
  </g>
</svg>
