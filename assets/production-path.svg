<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
  <title id="title">From a free synthetic discount curve demo to governed production engineering</title>
  <desc id="desc">The public demo proves validation, NSS fitting, explicit discount factors, evidence, and guarded local output. Separately scoped production engineering can add authorized data contracts, approved adapters, approval gates, reconciliation and lineage, observability, and deployment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter><style>.eyebrow{font:760 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.5px}.headline{font:800 43px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{font:760 30px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:560 22px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.small{font:650 19px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font:650 16px ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
  <rect width="1000" height="1120" rx="34" fill="url(#bg)"/><circle cx="940" cy="20" r="260" fill="#f59e0b" opacity=".07"/><circle cx="30" cy="1090" r="270" fill="#14b8a6" opacity=".07"/>
  <text x="500" y="60" text-anchor="middle" class="eyebrow" fill="#fcd34d">FREE PROOF → CONTROLLED PRODUCTION PATH</text><text x="500" y="116" text-anchor="middle" class="headline" fill="#f8fafc">Start local. Scope the real boundary.</text>
  <g transform="translate(60 158)" filter="url(#shadow)"><rect width="880" height="222" rx="28" fill="#111827" stroke="#fbbf24" stroke-opacity=".42" stroke-width="2"/><rect x="28" y="26" width="210" height="36" rx="18" fill="#fbbf24" fill-opacity=".13"/><text x="133" y="51" text-anchor="middle" class="eyebrow" fill="#fde68a">FREE · PUBLIC</text><text x="28" y="112" class="title" fill="#f8fafc">Synthetic Discount Curve Lab</text><text x="28" y="151" class="body" fill="#cbd5e1">Validate · fit zero rates · generate DFs · prove · opt in</text><rect x="28" y="174" width="824" height="26" rx="13" fill="#0b1018"/><text x="440" y="193" text-anchor="middle" class="mono" fill="#fcd34d">NO LIVE FEED · NO DATABASE · NO EMAIL · NO CLOUD ADAPTER</text></g>
  <path d="M500 398v48" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M500 462l-13-20h26z" fill="#fbbf24"/><rect x="246" y="420" width="508" height="34" rx="17" fill="#0b1018" stroke="#94a3b8" stroke-opacity=".18"/><text x="500" y="443" text-anchor="middle" class="mono" fill="#e2e8f0">SEPARATELY SCOPED · CUSTOMER-AUTHORIZED</text>
  <g transform="translate(60 492)" filter="url(#shadow)"><rect width="880" height="522" rx="28" fill="#111c2b" stroke="#2dd4bf" stroke-opacity=".42" stroke-width="2"/><rect x="28" y="26" width="300" height="36" rx="18" fill="#2dd4bf" fill-opacity=".12"/><text x="178" y="51" text-anchor="middle" class="eyebrow" fill="#99f6e4">PRODUCTION ENGINEERING</text><text x="28" y="112" class="title" fill="#f8fafc">Govern the system around the model</text><text x="28" y="151" class="body" fill="#cbd5e1">Architecture, controls, and deliverables agreed for the approved environment.</text>
    <g transform="translate(28 192)">
      <g><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#fbbf24" fill-opacity=".18"/><text x="35" y="46" text-anchor="middle" class="small" fill="#fde68a">1</text><text x="64" y="34" class="small" fill="#f8fafc">Data contracts</text><text x="64" y="59" class="mono" fill="#94a3b8">schema + quality rules</text></g>
      <g transform="translate(420)"><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#fbbf24" fill-opacity=".18"/><text x="35" y="46" text-anchor="middle" class="small" fill="#fde68a">2</text><text x="64" y="34" class="small" fill="#f8fafc">Approved adapters</text><text x="64" y="59" class="mono" fill="#94a3b8">vendor + market sources</text></g>
      <g transform="translate(0 96)"><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#2dd4bf" fill-opacity=".17"/><text x="35" y="46" text-anchor="middle" class="small" fill="#99f6e4">3</text><text x="64" y="34" class="small" fill="#f8fafc">Approval gates</text><text x="64" y="59" class="mono" fill="#94a3b8">review before effects</text></g>
      <g transform="translate(420 96)"><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#2dd4bf" fill-opacity=".17"/><text x="35" y="46" text-anchor="middle" class="small" fill="#99f6e4">4</text><text x="64" y="34" class="small" fill="#f8fafc">Reconciliation + lineage</text><text x="64" y="59" class="mono" fill="#94a3b8">trace every output</text></g>
      <g transform="translate(0 192)"><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#60a5fa" fill-opacity=".17"/><text x="35" y="46" text-anchor="middle" class="small" fill="#bfdbfe">5</text><text x="64" y="34" class="small" fill="#f8fafc">Observability</text><text x="64" y="59" class="mono" fill="#94a3b8">runs + drift + evidence</text></g>
      <g transform="translate(420 192)"><rect width="396" height="78" rx="18" fill="#0b1018"/><circle cx="35" cy="39" r="15" fill="#60a5fa" fill-opacity=".17"/><text x="35" y="46" text-anchor="middle" class="small" fill="#bfdbfe">6</text><text x="64" y="34" class="small" fill="#f8fafc">Controlled deployment</text><text x="64" y="59" class="mono" fill="#94a3b8">agreed runtime boundary</text></g>
    </g>
    <rect x="28" y="470" width="824" height="34" rx="17" fill="#0b1018"/><text x="440" y="493" text-anchor="middle" class="mono" fill="#99f6e4">NOT INCLUDED IN THE PUBLIC DEMO · NO OUTCOME OR SLA CLAIM</text>
  </g>
  <g transform="translate(110 1030)"><rect width="780" height="58" rx="29" fill="#fbbf24"/><text x="390" y="38" text-anchor="middle" class="title" fill="#211500">Discuss a non-sensitive use case →</text></g>
</svg>
