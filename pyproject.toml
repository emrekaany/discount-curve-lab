[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-discount-curve-lab"
version = "0.1.0"
description = "Synthetic, dry-run-first NSS zero rates and continuous discount factors."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Emre Kaan Yilmaz"}]
keywords = [
  "discount-curve",
  "data-engineering",
  "nelson-siegel-svensson",
  "quantitative-finance",
  "synthetic-data",
  "term-structure",
  "zero-rate",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/emrekaany/discount-curve-lab"
Repository = "https://github.com/emrekaany/discount-curve-lab"
Issues = "https://github.com/emrekaany/discount-curve-lab/issues"
Documentation = "https://github.com/emrekaany/discount-curve-lab#readme"

[project.scripts]
discount-curve-demo = "discount_curve_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["discount_curve_demo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
